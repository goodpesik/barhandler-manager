# PET-971 — builds a product's offline runtime for an installer: the offline
# service (goodpesik/<product>-offline), the offline build of the app
# (goodpesik/<product>-app) and the official Node binary, laid out by
# scripts/build_offline_runtime.sh into <out>. Petshandler's repos are the
# defaults; FC-798 calls it again with FitStudioCRM's.
#
# Needs two secrets from the calling job:
#   OFFLINE_REPO_TOKEN   read access to both private repos
#   <PRODUCT>_APP_ENV    the app's .env, base64 (the build needs its VITE_* values;
#                        with app-env-required 'true' an empty one fails the job)
# The jobs call this only when OFFLINE_REPO_TOKEN is set, so a release without
# them builds exactly as before, with no offline mode.
name: offline-runtime
description: Build a product's offline runtime for the installers
inputs:
  platform:
    description: win-x64 | darwin-arm64 | darwin-x64
    required: true
  out:
    description: where to lay it out (e.g. offline-runtime/petshandler)
    required: true
  token:
    description: read access to the two private repos
    required: true
  app-env:
    description: the app's .env, base64
    required: true
  service-repo:
    description: the offline service's repository
    required: false
    default: goodpesik/petshandler-offline
  app-repo:
    description: the app's repository (its offline build is served by the service)
    required: false
    default: goodpesik/petshandler-app
  app-ref:
    description: which ref of the app to build the offline app from
    required: false
    default: production
  service-ref:
    description: which ref of the offline service to build
    required: false
    default: main
  app-env-required:
    description: "'true' fails the build when app-env is empty instead of building the app without its VITE_* values"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Check the app's .env is given
      shell: bash
      env:
        APP_ENV: ${{ inputs.app-env }}
        REQUIRED: ${{ inputs.app-env-required }}
        APP_REPO: ${{ inputs.app-repo }}
      run: |
        if [ "$REQUIRED" = "true" ] && [ -z "$APP_ENV" ]; then
          echo "::error::the app's .env secret for $APP_REPO is empty; set it or switch this offline runtime off"
          exit 1
        fi
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.service-repo }}
        ref: ${{ inputs.service-ref }}
        token: ${{ inputs.token }}
        path: .offline-src/service
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.app-repo }}
        ref: ${{ inputs.app-ref }}
        token: ${{ inputs.token }}
        path: .offline-src/app
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Build the offline service and the offline app
      shell: bash
      env:
        APP_ENV: ${{ inputs.app-env }}
      run: |
        set -euo pipefail
        (cd .offline-src/service && npm ci && npm run build)
        printf '%s' "$APP_ENV" | base64 --decode > .offline-src/app/.env
        (cd .offline-src/app && npm ci && npm run build:offline)
        rm -f .offline-src/app/.env
    - name: Lay out the runtime
      shell: bash
      env:
        # The Node the service is developed and tested with (node:sqlite).
        NODE_VERSION: v22.22.3
      run: |
        bash scripts/build_offline_runtime.sh "${{ inputs.platform }}" "${{ inputs.out }}" \
          .offline-src/service .offline-src/app/dist-offline
