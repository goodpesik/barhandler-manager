# Release pipeline.
#
# `production` is release-only; every push to it (typically a merge
# from `main` via PR) cuts a new GitHub Release with the source
# tarball, source zip, and the three installers as downloadable
# assets — that's what install.sh / install.ps1 fetch from the
# /releases/latest/download/ path.
#
# Version comes from VERSION at the repo root. Bump it in the PR
# that lands the release; CI tags the commit with v<X.Y.Z> after
# publishing.

name: publish

on:
  push:
    branches: [production]

permissions:
  contents: write  # create releases + push tags

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can read prior tags + commit messages

      - name: Resolve version
        id: version
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "")
          LATEST_TAG=$(git tag --sort=-v:refname | head -n1 | sed 's/^v//')

          # Auto-bump patch from latest tag
          if [ -n "$LATEST_TAG" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            AUTO_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            AUTO_VERSION="0.1.0"
          fi

          # Use VERSION file if it's higher (manual minor/major bump),
          # otherwise use auto-bumped patch.
          if [ -n "$FILE_VERSION" ] && [ "$(printf '%s\n' "$FILE_VERSION" "$AUTO_VERSION" | sort -V | tail -n1)" = "$FILE_VERSION" ] \
             && [ "$FILE_VERSION" != "$AUTO_VERSION" ]; then
            VERSION="$FILE_VERSION"
          else
            VERSION="$AUTO_VERSION"
          fi

          # Fail if tag already exists (shouldn't happen with auto-bump)
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (file=$FILE_VERSION, auto=$AUTO_VERSION, latest_tag=$LATEST_TAG)"

      - name: Sync VERSION file and version strings
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "$VERSION" > VERSION
          sed -i "s/version=\"[0-9]*\.[0-9]*\.[0-9]*\"/version=\"$VERSION\"/g" src/server.py || true
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"$VERSION\"/g" src/routes/health.py || true
          if git diff --quiet; then
            echo "No version files to update"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION src/server.py src/routes/health.py
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:production
          fi

      - name: Build source archives
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          tar --exclude='./dist' \
              --exclude='./.git' \
              --exclude='./.venv' \
              --exclude='./__pycache__' \
              --exclude='*.pyc' \
              --exclude='./printers.json' \
              --exclude='./terminals.json' \
              -czf "dist/barhandler-manager-${VERSION}.tar.gz" .
          zip -rq "dist/barhandler-manager-${VERSION}.zip" . \
              -x 'dist/*' '.git/*' '.venv/*' '*.pyc' '__pycache__/*' \
              'printers.json' 'terminals.json'

      - name: Stage installers as named assets
        run: |
          cp installers/install.sh         dist/install.sh
          cp installers/install-android.sh dist/install-android.sh
          # strip any leading UTF-8 BOM so `irm ... | iex` parses on Windows PowerShell 5.1
          python3 -c "import sys; d=open('installers/install.ps1','rb').read(); open('dist/install.ps1','wb').write(d[3:] if d[:3]==b'\xef\xbb\xbf' else d)"
          chmod +x dist/install.sh dist/install-android.sh

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n1)
          if [ -z "$PREV_TAG" ]; then
            RANGE=HEAD
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          {
            # If CHANGELOG.md has an [Unreleased] section, surface that
            # first — it's the human-curated story of the release.
            if [ -f CHANGELOG.md ] && grep -q '## \[Unreleased\]' CHANGELOG.md; then
              awk '/^## \[Unreleased\]/{flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md
              echo
            fi
            echo "## Commits"
            git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges
            echo
            echo
            echo "## Install"
            echo
            echo "**macOS — .dmg (signed + notarized, just double-click)**"
            echo
            echo "- Apple Silicon: device-handler-silicon.dmg"
            echo "- Intel: device-handler-intel.dmg"
            echo
            echo "**macOS / Linux / Raspberry Pi — script**"
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo "**Windows**"
            echo '```powershell'
            echo "irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1 | iex"
            echo '```'
            echo
            echo "**Android (Termux)**"
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-android.sh | bash"
            echo '```'
          } > dist/notes.md

      - name: Tag the commit
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: dist/notes.md
          draft: false
          prerelease: false
          files: |
            dist/barhandler-manager-${{ steps.version.outputs.version }}.tar.gz
            dist/barhandler-manager-${{ steps.version.outputs.version }}.zip
            dist/install.sh
            dist/install-android.sh
            dist/install.ps1

  # Gate the Windows exe on a green test run. The source release above is
  # unaffected (ships as before); this only ADDS bhm.exe to it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q

  # Build the Windows exe on a Windows runner and attach it to the release
  # created above (same vX.Y.Z tag → stable /releases/latest/download/bhm.exe).
  build-windows-exe:
    needs: [release, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}   # the freshly-cut release tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + PyInstaller + libusb
        run: pip install -r requirements.txt pyinstaller libusb-package
      - name: Build exe
        run: pyinstaller --noconfirm bhm.spec
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $exe = (Resolve-Path dist\bhm.exe).Path
          $out = (Resolve-Path dist).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.release.outputs.version }} "/DExePath=$exe" "/O$out" installers\barhandler-setup.iss
      # Нові імена активів — device-handler-*, бо продукт називається Handler
      # Device Manager. Старі (bhm.exe, barhandler-setup.exe) лишаються КОПІЯМИ
      # того самого файлу: кнопка «Оновити» у копіях, уже встановлених у полі,
      # тягне /releases/latest/download/barhandler-setup.exe своїм власним
      # кодом (src/routes/system.py у ТІЙ версії). Прибрати старі імена можна
      # буде тоді, коли в полі не лишиться інсталяцій, старших за цей реліз.
      - name: Stage renamed copies (new names + legacy aliases)
        shell: pwsh
        run: |
          Copy-Item dist\bhm.exe dist\device-handler.exe
          Copy-Item dist\barhandler-setup.exe dist\device-handler-setup.exe

      - name: Attach exe + installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/device-handler.exe
            dist/device-handler-setup.exe
            dist/bhm.exe
            dist/barhandler-setup.exe

  # Build the macOS .app on mac runners, wrap it in a .dmg and attach it to the
  # same release. TWO artifacts, not one: PyInstaller freezes for the
  # architecture it runs on, so Apple Silicon and Intel each need their own
  # build. universal2 is not an option here — it needs a universal Python and
  # universal wheels for every dependency, and libusb does not play along.
  #
  # Signing + notarization happen inside scripts/mac_sign_and_package.sh when
  # the MAC_* secrets are present; see docs/macos-signing.md.
  build-macos-app:
    needs: [release, test]
    strategy:
      fail-fast: false   # an Intel hiccup must not withhold the Silicon .dmg
      matrix:
        include:
          - runner: macos-15
            arch: silicon
          # macos-13 знято з Actions у грудні 2025 — офіційна заміна для
          # x86_64 це macos-15-intel (знайдено ревʼю: на macos-13 джоба просто
          # не знайшла б раннера, і Intel-збірки не було б ніколи).
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}   # the freshly-cut release tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # README обіцяє підписану й пронотаризовану збірку БЕЗ застережень, а сам
      # скрипт свідомо вміє ad-hoc, щоб не валити форки. На РЕЛІЗНОМУ каналі
      # така поблажливість означала б тихо випущений .dmg із «unidentified
      # developer» при README, який каже протилежне. Тому тут секрети
      # обовʼязкові (знайдено ревʼю).
      # Перевіряємо ВСІ ПʼЯТЬ, а не два: підпис включає пара
      # MAC_CERT_P12_BASE64 + MAC_CERT_PASSWORD, а нотаризацію — всі три
      # MAC_NOTARY_*. Знайдено ревʼю: із перевіркою двох забутий
      # MAC_CERT_PASSWORD пропускав джобу далі, скрипт тихо падав в ad-hoc, і
      # реліз виходив із «unidentified developer» при README, що обіцяє інше.
      - name: Require signing secrets on the release channel
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
        run: |
          missing=""
          [ -n "$MAC_CERT_P12_BASE64" ] || missing="$missing MAC_CERT_P12_BASE64"
          [ -n "$MAC_CERT_PASSWORD" ] || missing="$missing MAC_CERT_PASSWORD"
          [ -n "$MAC_NOTARY_APPLE_ID" ] || missing="$missing MAC_NOTARY_APPLE_ID"
          [ -n "$MAC_NOTARY_PASSWORD" ] || missing="$missing MAC_NOTARY_PASSWORD"
          [ -n "$MAC_NOTARY_TEAM_ID" ] || missing="$missing MAC_NOTARY_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::релізна мак-збірка без підпису не виходить; немає секретів:$missing (див. docs/macos-signing.md)"
            exit 1
          fi
      - name: Install deps + PyInstaller + libusb
        run: pip install -r requirements.txt pyinstaller libusb-package
      - name: Build .app
        run: pyinstaller --noconfirm bhm.spec
      - name: Sign, package and notarize
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
        run: |
          bash scripts/mac_sign_and_package.sh \
            dist/BarhandlerManager.app \
            "dist/device-handler-${{ matrix.arch }}.dmg"
      # Не action-gh-release: дві джоби матриці пишуть в ОДИН реліз паралельно,
      # а той екшн оновлює реліз цілком (в історії є гонка «Existing releases
      # are no longer updated»). `gh release upload` додає конкретний файл —
      # незалежні виклики не заважають одне одному. Знайдено ревʼю.
      - name: Attach .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            "dist/device-handler-${{ matrix.arch }}.dmg" --clobber
